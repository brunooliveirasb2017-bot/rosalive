<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RosaLive — Sala de Áudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@daily-co/daily-js"></script>
<style>
  :root{
    --pink:#ff2f87; --pink-2:#ff6fae; --gold:#f4c542; --cream:#fbe9f0; --muted:#c99bb0;
    --good:#57d68d; --bad:#ff5a5a; --line:rgba(255,143,195,.35); --bg:#0d0410;
    --font-display:"Fraunces", serif; --font-body:"Inter", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 70% at 50% 0%, #2c0f22 0%, var(--bg) 55%);
    color:var(--cream); font-family:var(--font-body); min-height:100vh;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:10px 10px 14px; position:relative; }

  .toast{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px); background:#2c1420; border:1px solid var(--line); color:var(--cream); padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:999; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .topbar{ display:flex; align-items:flex-start; gap:4px; }

  .ribbon{ flex:0 0 auto; width:56px; padding:6px 3px 8px; text-align:center;
    background:linear-gradient(180deg,#4a1c8a,#8a1d5a 85%); border:1.5px solid var(--gold); border-top:none;
    clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%); }
  .ribbon .crown{ font-size:15px; line-height:1; }
  .ribbon .txt{ color:var(--gold); font-weight:800; font-size:7px; letter-spacing:.04em; margin-top:1px; }
  .ribbon .dots{ color:var(--gold); font-size:6px; margin-top:2px; letter-spacing:1px; }

  .head{ flex:1; text-align:center; padding-top:2px; min-width:0; }
  .head h1{ font-family:var(--font-display); font-size:14px; font-weight:700; color:var(--cream); display:flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; }
  .head h1 .wave{ color:var(--pink-2); font-size:10px; letter-spacing:1px; }
  .head .premium{ color:var(--gold); font-weight:700; font-size:10px; margin-top:3px; letter-spacing:.05em; }
  .head .cap-pill{ display:inline-block; margin-top:5px; border:1.5px solid var(--pink); color:var(--pink-2); border-radius:999px; padding:2px 12px; font-size:10px; font-weight:700; letter-spacing:.04em; }

  .top-right{ flex:0 0 auto; text-align:right; }
  .coin-pill{ display:inline-flex; align-items:center; gap:4px; background:#1c0a14; border:1px solid var(--gold); border-radius:999px; padding:4px 8px; font-weight:700; font-size:11px; white-space:nowrap; }
  .coin-pill .c{ width:13px;height:13px;border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffe9a8, var(--gold)); display:inline-flex; align-items:center; justify-content:center; font-size:8px; color:#3a2500; }
  .icon-row{ display:flex; gap:6px; justify-content:flex-end; margin-top:5px; }
  .icon-row button{ background:none; border:none; color:var(--muted); font-family:var(--font-body); display:flex; flex-direction:column; align-items:center; gap:1px; font-size:7.5px; cursor:pointer; }
  .icon-row button .i{ font-size:13px; }

  .seat-grid{ margin-top:12px; display:grid; grid-template-columns:repeat(5,1fr); gap:5px; row-gap:16px; }
  .heart-cell{ position:relative; aspect-ratio:1/1; }
  .heart-outer, .heart-inner{ position:absolute; clip-path:url(#heart-clip); }
  .heart-outer{ inset:0; background:linear-gradient(150deg,var(--pink),var(--pink-2)); filter:drop-shadow(0 0 6px rgba(255,47,135,.85)); }
  .heart-inner{ inset:6%; background:linear-gradient(160deg,#4a1130,#22101c 75%); }
  .heart-cell .num{ position:absolute; top:0; left:4px; background:#1c0a14; color:#fff; font-size:8px; font-weight:700; padding:1px 4px; border-radius:5px; z-index:3; }
  .heart-cell .silhouette{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:2; padding-bottom:12%; }
  .heart-cell .silhouette svg{ width:44%; height:44%; fill:#8a3a5a; }
  .heart-cell .mic{ position:absolute; bottom:8%; left:50%; transform:translateX(-50%); font-size:8px; color:var(--pink-soft,#ffd6e8); opacity:.9; z-index:3; }
  .heart-cell .mic.muted{ color:var(--bad); }
  .heart-cell .name{ position:absolute; bottom:-13px; left:0; right:0; text-align:center; font-size:7px; color:var(--cream); display:none; }
  .heart-cell.occupied .name{ display:block; }
  .heart-cell.mine .heart-outer{ background:linear-gradient(150deg,var(--gold),#ffdd8a); filter:drop-shadow(0 0 8px rgba(244,197,66,.85)); }
  .heart-cell.leader .crown-badge{ position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-size:14px; z-index:4; }

  .bar{ margin-top:18px; background:rgba(28,10,20,.7); border:1px solid var(--line); border-radius:16px; padding:8px 2px; display:flex; justify-content:space-around; }
  .bar button{ background:none; border:none; color:var(--cream); display:flex; flex-direction:column; align-items:center; gap:2px; font-family:var(--font-body); font-size:8.5px; cursor:pointer; padding:2px; }
  .bar button .i{ font-size:16px; }
  .bar button .st{ font-size:7.5px; font-weight:700; }
  .bar button .st.on{ color:var(--good); }
  .bar button .st.off{ color:var(--bad); }
  .bar button.danger .i, .bar button.danger .lbl{ color:var(--bad); }

  .nav2{ margin-top:10px; display:flex; justify-content:space-around; align-items:flex-end; }
  .nav2 button{ background:none; border:none; color:var(--cream); display:flex; flex-direction:column; align-items:center; gap:3px; font-family:var(--font-body); font-size:8.5px; cursor:pointer; }
  .nav2 button .i{ font-size:15px; }
  .nav2 .center{ transform:translateY(-6px); }
  .nav2 .center .i{ font-size:20px; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--gold),#ffb14a); color:#3a2500; box-shadow:0 0 16px -2px rgba(244,197,66,.9); }
  .nav2 .center .lbl{ color:var(--gold); font-weight:700; }

  .status-line{ text-align:center; margin-top:14px; color:var(--muted); font-size:10px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;">
  <clipPath id="heart-clip" clipPathUnits="objectBoundingBox">
    <path d="M0.5,0.24 C0.42,0.02 0.02,0.05 0.02,0.34 C0.02,0.58 0.28,0.78 0.5,0.98 C0.72,0.78 0.98,0.58 0.98,0.34 C0.98,0.05 0.58,0.02 0.5,0.24 Z"/>
  </clipPath>
</svg>

<div class="wrap">
  <div class="topbar">
    <div class="ribbon"><div class="crown">👑</div><div class="txt">PREMIUM</div><div class="dots">✦✦✦</div></div>

    <div class="head">
      <h1><span class="wave">·|||·</span> SALA DE ÁUDIO <span class="wave">·|||·</span></h1>
      <div class="premium">✦ PREMIUM ✦</div>
      <div class="cap-pill">15 LUGARES</div>
    </div>

    <div class="top-right">
      <div class="coin-pill"><span class="c">$</span><span id="balance">—</span></div>
      <div class="icon-row">
        <button onclick="soon('Ranking')"><span class="i">🏆</span>Rank.</button>
        <button onclick="soon('Presentes')"><span class="i">🎁</span>Pres.</button>
        <button onclick="soon('Configurações')"><span class="i">⚙️</span>Conf.</button>
      </div>
    </div>
  </div>

  <div class="seat-grid" id="seat-grid"></div>

  <div class="bar">
    <button id="btn-mic" onclick="toggleMic()"><span class="i">🎤</span><span>Microfone</span><span class="st on" id="mic-st">Ligado</span></button>
    <button id="btn-spk" onclick="toggleSpeaker()"><span class="i">🔊</span><span>Alto-falante</span><span class="st on" id="spk-st">Ligado</span></button>
    <button onclick="soon('Presentes')"><span class="i">🎀</span><span>Presente</span></button>
    <button onclick="soon('Chat')"><span class="i">💬</span><span>Chat</span></button>
    <button class="danger" onclick="leaveRoom()"><span class="i">↪️</span><span class="lbl">Sair da Sala</span></button>
  </div>

  <div class="nav2">
    <button onclick="soon('Participantes')"><span class="i">👥</span>Participantes</button>
    <button onclick="soon('Ranking da sala')"><span class="i">👑</span>Ranking da Sala</button>
    <button class="center" onclick="soon('Presentes')"><span class="i">🎁</span><span class="lbl">Enviar Presente</span></button>
    <button onclick="soon('Top Presentes')"><span class="i">📊</span>Top Presentes</button>
    <button onclick="location.href='index.html'"><span class="i">🪙</span>Recarga de Moedas</button>
  </div>

  <div class="status-line" id="status-line">Entrando na sala…</div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://tnlssnevrgdknapqyssg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4Z1zOfzG2FZuNa0i2IC_5w_WH9t6DFT";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ROOM_KEY = "coracao-15";
const CAPACITY = 15;
const LEADER_SEAT = 8;

let myUserId = null;
let mySeatNumber = null;
let amLeader = false;
let callObject = null;
let micOn = true;
let speakerOn = true;
let seatsState = {};

function fmt(n){ return Number(n||0).toLocaleString("pt-BR"); }
function soon(label){ showToast((label||"Isso") + " chega em breve por aqui."); }
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

async function callEdgeFunction(name, body){
  const { data: sessionData } = await sb.auth.getSession();
  const token = sessionData && sessionData.session ? sessionData.session.access_token : null;
  if(!token) throw new Error("Sessão expirada, entre novamente no app.");
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${token}` },
    body: JSON.stringify(body||{}),
  });
  const j = await res.json();
  if(!res.ok) throw new Error((j && j.error && (j.error.message||j.error)) || "Erro no servidor.");
  return j;
}

function renderSeatGrid(){
  const grid = document.getElementById("seat-grid");
  grid.innerHTML = "";
  for(let n=1; n<=CAPACITY; n++){
    const cell = document.createElement("div");
    const info = seatsState[n];
    const isLeaderSeat = n === LEADER_SEAT;
    cell.className = "heart-cell" + (isLeaderSeat?" leader":"") + (info?" occupied":"") + (info && info.user_id===myUserId?" mine":"");
    cell.id = "seat-"+n;
    let inner = `<div class="heart-outer"></div><div class="heart-inner"></div>`;
    if(isLeaderSeat) inner += `<div class="crown-badge">👑</div>`;
    inner += `<div class="num">${n}</div>`;
    inner += `<div class="silhouette"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></div>`;
    inner += `<div class="mic${info && info.mic_on===false ? " muted":""}">${info ? (info.mic_on===false?"🔇":"🎙️") : ""}</div>`;
    inner += `<div class="name">${info ? (info.display_name||"—") : ""}</div>`;
    cell.innerHTML = inner;
    grid.appendChild(cell);
  }
}

async function loadSeatsFromDb(){
  const { data } = await sb.from("seat_room_seats").select("*").eq("room_key", ROOM_KEY);
  seatsState = {};
  (data||[]).forEach(row=>{ seatsState[row.seat_number] = row; });
  renderSeatGrid();
}

function subscribeRealtime(){
  sb.channel("seat-room-"+ROOM_KEY)
    .on("postgres_changes", { event:"*", schema:"public", table:"seat_room_seats", filter:`room_key=eq.${ROOM_KEY}` }, ()=>{
      loadSeatsFromDb();
    })
    .subscribe();
}

async function joinDaily(res){
  callObject = window.DailyIframe.createCallObject();
  callObject.on("error", e=>console.error("Daily error:", e));
  await callObject.join({ url: res.room_url, token: res.token, startVideoOff: true, startAudioOff: false });
}

function toggleMic(){
  if(!callObject) return;
  micOn = !micOn;
  callObject.setLocalAudio(micOn);
  document.getElementById("mic-st").textContent = micOn ? "Ligado" : "Desligado";
  document.getElementById("mic-st").className = "st " + (micOn?"on":"off");
  sb.from("seat_room_seats").update({ mic_on: micOn }).eq("room_key", ROOM_KEY).eq("user_id", myUserId).then(()=>{});
}

function toggleSpeaker(){
  speakerOn = !speakerOn;
  if(callObject){
    const participants = callObject.participants();
    Object.keys(participants).forEach(id=>{
      if(!participants[id].local) callObject.updateParticipant(id, { setSubscribedTracks: speakerOn ? true : { audio:false, video:false, screenVideo:false } });
    });
  }
  document.getElementById("spk-st").textContent = speakerOn ? "Ligado" : "Desligado";
  document.getElementById("spk-st").className = "st " + (speakerOn?"on":"off");
}

async function leaveRoom(){
  try{
    if(callObject){ try{ callObject.leave(); callObject.destroy(); }catch(e){} callObject=null; }
    await callEdgeFunction("leave-seat-room", { room_key: ROOM_KEY });
  }catch(e){ console.error(e); }
  window.location.href = "index.html";
}

function leaveBeacon(){
  if(!myUserId) return;
  sb.auth.getSession().then(({data})=>{
    const token = data && data.session ? data.session.access_token : null;
    if(!token) return;
    fetch(`${SUPABASE_URL}/functions/v1/leave-seat-room`, {
      method:"POST", keepalive:true,
      headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${token}` },
      body: JSON.stringify({ room_key: ROOM_KEY }),
    }).catch(()=>{});
  });
}
window.addEventListener("beforeunload", leaveBeacon);

async function init(){
  const { data: auth } = await sb.auth.getUser();
  if(!auth || !auth.user){ window.location.href="index.html"; return; }
  myUserId = auth.user.id;

  const { data: profile } = await sb.from("profiles").select("balance").eq("id", myUserId).single();
  document.getElementById("balance").textContent = fmt(profile ? profile.balance : 0);

  try{
    const res = await callEdgeFunction("enter-seat-room", { room_key: ROOM_KEY });
    mySeatNumber = res.seat_number;
    amLeader = res.is_leader;
    document.getElementById("status-line").textContent = amLeader
      ? "Você criou esta sala — está no assento do líder."
      : "Você entrou no assento " + mySeatNumber + ".";
    await loadSeatsFromDb();
    subscribeRealtime();
    await joinDaily(res);
  }catch(e){
    document.getElementById("status-line").textContent = "Não foi possível entrar: " + e.message;
  }
}
init();
</script>
</body>
</html>
